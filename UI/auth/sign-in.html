<!doctype html>
<html lang="en">

   <head>
      <!--=============== basic  ===============-->
      <title>Hope UI | Responsive Bootstrap 5 Admin Dashboard Template</title>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="robots" content="index" />
      <meta name="Description" content="The monitor for pm2 servers" />
      <meta property="og:locale" content="en_US" />
      <meta property="og:title" content="Dashboard" />
      <meta property="og:type" content="webapp" />
      <meta property="og:site_name" content="Aland" />
      <meta name="theme-color" content="#fff">
      <meta name="author" content="Aland Mariwan">
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <!--=============== favicons ===============-->
      <link rel="shortcut" href="../assets/img/svg/logo.svg">
      <link rel="icon" href="../assets/img/svg/logo.svg">
      <link rel="apple-touch-icon-precomposed" sizes="180x180" href="../assets/img/svg/logo.svg">
      <link rel="apple-touch-startup-image" sizes="180x180" href="../assets/img/svg/logo.svg">
      <link rel="manifest" href="../assets/img/manifest.json">
      <link rel="shortcut icon" href="../assets/img/svg/logo.svg" type="image/x-icon">
      <!--=============== CSS ===============-->
      <!-- Library / Plugin Css Build -->
      <link rel="stylesheet" href="../assets/css/core/libs.min.css" />
      <!-- Hope Ui Design System Css -->
      <link rel="stylesheet" href="../assets/css/hope-ui.min.css" />
      <!-- Custom Css -->
      <link rel="stylesheet" href="../assets/css/custom.min.css" />
      <!-- Dark Css -->
      <link rel="stylesheet" href="../assets/css/dark.min.css" />
      <!-- Customizer Css -->
      <link rel="stylesheet" href="../assets/css/customizer.min.css" />
      <link rel="stylesheet" href="../assets/css/notify.css" />

      <!--=============== JS ===============-->
      <script src="../assets/js/plugins/vue.global.js"></script>
      <script src="../assets/js/plugins/axios.min.js"></script>
   </head>

   <body class=" ">
      <!-- loader Start -->
      <div id="loading">
         <div class="loader simple-loader">
            <div class="loader-body"></div>
         </div>
      </div>
      <!-- loader END -->
      <div class="wrapper app">
         <transition name="fade" @keyup.enter="doLogin">
            <section class="login-content">
               <div class="row m-0 align-items-center bg-white vh-100">
                  <div class="position-absolute z-index-1">
                     <div class=" row justify-content-center">
                        <div class="col-md-4">
                           <div
                              class="card card-transparent shadow-none d-flex justify-content-center mb-0 auth-card blur">
                              <div class="card-body ">
                                 <h2 class="mb-2 text-center">Sign In</h2>
                                 <p class="text-center">Login to stay connected.</p>
                                 <div class="row">
                                    <div class="col-lg-12">
                                       <div class="form-group">
                                          <label for="username" class="form-label">username</label>
                                          <input v-model="username" type="text" class="form-control blur" placeholder=""
                                             :class="isUserNameValidCls" required>
                                          {{isUserNameValidMsg}}
                                       </div>
                                    </div>
                                    <div class="col-lg-12">
                                       <div class="form-group">
                                          <label for="password" class="form-label">Password</label>
                                          <input v-model="password" type="password" class="form-control blur"
                                             placeholder="" :class="isPasswordValidCls" required>
                                          {{isPasswordValidMsg}}
                                       </div>
                                    </div>
                                 </div>
                                 <div class="d-flex justify-content-center">
                                    <button type="submit" class="btn btn-primary" @click="doLogin">Sign In</button>
                                 </div>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
                  <div class=" bg-primary p-0 mt-n1 vh-100 overflow-hidden">
                     <img src="assets/images/pages/sky.jpg" class="img-fluid gradient-main animated-scaleX"
                        alt="images">
                  </div>
               </div>
            </section>
         </transition>
      </div>
      <script src="../assets/js/core/libs.min.js"></script>
      <script src="../assets/js/modules/crpyto.js"></script>
      <script src="../assets/js/pages/sign-in.js"></script>
      <script src="../assets/js/plugins/notify.js"></script>

      <script src="../assets/js/hope-ui.js" defer></script>
   </body>

</html>
